[project]
name = "winter-test-service"
version = "0.1.0"
description = "Full-stack app: React web, FastAPI API, Postgres, and a background worker"
license = "FSL-1.1-ALv2"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "psycopg[binary]==3.3.6",
    "sqlalchemy>=2.0,<3.0",
    "pika==1.3.2",
]

# An application, not a library: the api and worker are run from source
# (PYTHONPATH / -m), so uv manages the venv + deps without building this repo.
[tool.uv]
required-version = ">=0.13,<0.14"
package = false

[dependency-groups]
dev = [
    "ruff==0.17.1",
    "pytest==8.3.4",
    "httpx==0.28.1",
]

# The repo root holds the shared wts_* packages and wts_logging; api/ holds the
# `app` package. These are the same two roots the run commands put on sys.path.
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "api"]

# First-party roots for import sorting — the same two as pytest's pythonpath, so
# `app` (under api/) sorts as first-party in api/ and tests/ alike.
[tool.ruff]
src = [".", "api"]
